name: 更新 AI 行业精选

on:
  schedule:
    # GitHub Actions cron uses UTC. 01:00 UTC = 09:00 Asia/Shanghai.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ai-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update AI news feed
        run: python scripts/update_ai_news.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ai-news.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update AI industry feed"
          git push
